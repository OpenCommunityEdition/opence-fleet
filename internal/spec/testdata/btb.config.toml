# Written by opence-fleet for btb-eu-1 before each start: a change made here is
# overwritten. The fleet sets the rest (ports, passwords, paths, the publisher
# key) in the environment, where the server pins them.

[server]
max_players = 12
motd = "Say \"hi\"\\ welcome"
name = "BTB EU #1"
