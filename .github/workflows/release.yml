# A release: push a version tag (git tag v0.1.0 && git push origin v0.1.0).
# It tests, builds the binaries for linux amd64, arm64 and armv7 (the
# control plane runs anywhere; a node that runs games is amd64, as the
# server image is), attaches the installers and the files they fetch, signs
# SHA256SUMS with the release key (the RELEASE_SIGNING_KEY secret: the
# fleet's updater and agent.sh install nothing else), pushes the multi-arch
# image to ghcr.io (latest, 0.1.0 and 0.1), and then publishes the GitHub
# release, which the fleets see within their FLEET_RELEASE_CHECK_INTERVAL.
# The agent is the same binary: a control plane of v0.1.0 offers its agents
# v0.1.0. The server image is the game repository's: the fleet ships none.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # the latest patch of go.mod's Go: the standard library's fixes
          go-version: "1.26.x"
          check-latest: true
      - name: the tag is a version (v1.2.3)
        run: '[[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - name: go vet and go test
        run: go vet ./... && go test -race ./...
      - name: known vulnerabilities (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: binaries
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 linux/arm/7; do
            IFS=/ read -r os arch arm <<< "$target"
            name="opence-fleet-$os-$arch${arm:+v$arm}"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch GOARM=$arm go build -trimpath \
              -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" -o "dist/$name" ./cmd/opence-fleet
          done
          ./dist/opence-fleet-linux-amd64 version | grep -q " $GITHUB_REF_NAME "
          # (the installers and the files install.sh fetches; agent.sh as a
          # template: the control plane serves it filled in, at /agent.sh)
          cp install.sh agent.sh compose.yaml compose.proxy.yaml compose.http.yaml dist/
          cp deploy/Caddyfile deploy/opence-fleet.service deploy/opence-fleet-agent.service \
            deploy/fleet.env.example deploy/agent.env.example dist/
          (cd dist && sha256sum -- * > SHA256SUMS)
      - name: sign SHA256SUMS
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          go run ./cmd/release-sign sign dist/SHA256SUMS
          go run ./cmd/release-sign verify dist/SHA256SUMS
      - name: the image, to ghcr.io
        env:
          TOKEN: ${{ github.token }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64,linux/arm/v7 --build-arg "VERSION=$GITHUB_REF_NAME" \
            -t "$image:latest" -t "$image:$version" -t "$image:${version%.*}" --push .
      - name: the GitHub release (last, so the fleets see it once everything is out)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
